<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>hood-scout board</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#262d37; --fg:#e6e9ee; --mute:#8b95a5; --acc:#7cc4ff; --green:#39c46a; --red:#ff5c5c; --amber:#f0b25a; --blue:#5aa7ff; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom:60px; }
  header { position:sticky; top:0; z-index:5; background:rgba(14,17,22,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; letter-spacing:.3px; }
  header .fresh { color:var(--mute); font-size:12px; }
  header .fresh.stale { color:var(--amber); }
  nav { display:flex; gap:6px; overflow-x:auto; padding:8px 14px; border-bottom:1px solid var(--line); scrollbar-width:none; }
  nav button { flex:0 0 auto; background:var(--panel); border:1px solid var(--line); color:var(--fg); padding:6px 10px; border-radius:999px; font-size:13px; }
  nav button.on { background:var(--acc); color:#08111c; border-color:var(--acc); font-weight:600; }
  main { padding:10px 14px; max-width:980px; margin:0 auto; }
  .bar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:8px 0 10px; }
  .bar button, .bar select, .bar input { background:var(--panel); border:1px solid var(--line); color:var(--fg); padding:5px 9px; border-radius:8px; font-size:12.5px; }
  .bar button.on { border-color:var(--acc); color:var(--acc); }
  .bar input { flex:1 1 140px; min-width:120px; }
  .sub { color:var(--mute); font-size:12px; margin:4px 0 10px; }
  .row { display:grid; grid-template-columns: 22px 1fr; gap:4px 8px; align-items:start; padding:9px 0; border-bottom:1px solid var(--line); }
  .row .addr, .row .acts { grid-column: 2; }
  .row .ph { font-size:15px; line-height:1.2; }
  .row .name { font-weight:600; }
  .row .name .chain { font-weight:500; color:var(--mute); font-size:11.5px; margin-left:6px; border:1px solid var(--line); padding:0 5px; border-radius:6px; }
  .row .meta { color:var(--mute); font-size:12.5px; margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; }
  .row .meta b { color:var(--fg); font-weight:500; }
  .up { color:var(--green); } .dn { color:var(--red); }
  .addr { font-family:var(--mono); font-size:11.5px; color:var(--mute); margin-top:3px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .addr code { background:var(--panel); padding:2px 6px; border-radius:6px; }
  .btn { background:var(--panel); border:1px solid var(--line); color:var(--fg); padding:5px 9px; border-radius:8px; font-size:12px; white-space:nowrap; }
  .btn:active { background:var(--line); }
  .btn.copied { border-color:var(--green); color:var(--green); }
  .acts { display:flex; flex-direction:row; gap:6px; }
  a { color:var(--blue); text-decoration:none; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:8px 0; }
  .card h3 { margin:0 0 6px; font-size:13.5px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--mute); font-weight:500; }
  .tbl { overflow-x:auto; }
  .kpi { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; }
  .kpi div { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .kpi small { color:var(--mute); display:block; font-size:11.5px; }
  .kpi b { font-size:16px; }
  .empty { color:var(--mute); padding:18px 0; text-align:center; }
  .warn { background:#2a1d10; border:1px solid #5a3c14; color:#f5c98a; padding:8px 10px; border-radius:10px; font-size:12.5px; margin:8px 0; }
  .spark { display:inline-flex; gap:2px; align-items:flex-end; height:14px; }
  .spark i { display:block; width:6px; background:var(--mute); border-radius:1px; }
  .tag { display:inline-block; font-size:10.5px; padding:1px 6px; border-radius:6px; border:1px solid #2f4a6a; color:#9cc9ff; background:#122033; margin-right:4px; }
  .row.open { background:rgba(255,255,255,.02); }
  .detail { grid-column: 1 / -1; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:12.5px; color:var(--mute); display:grid; gap:6px; }
  .detail b { color:var(--fg); font-weight:500; }
  .detail svg { width:100%; height:56px; display:block; }
  .row .name { cursor:pointer; }
  footer { color:var(--mute); font-size:11.5px; padding:14px; text-align:center; }
  @media (min-width:700px) { .row { grid-template-columns: 22px 1fr auto auto; } .row .addr, .row .acts { grid-column: auto; margin-top:0; } }
</style>
</head>
<body>
<header>
  <h1>hood-scout · board</h1>
  <span class="fresh" id="fresh">loading…</span>
  <span class="fresh" style="margin-left:auto">scans only · nothing here is a recommendation</span>
</header>
<nav id="nav"></nav>
<main id="main"><div class="empty">loading state.json…</div></main>
<footer>public scans feed · phases are descriptive (24h/6h windows) · every % is from our own recordings and stated with its n · survivorship bias applies</footer>

      out.push(h('div', { class: 'card' }, h('h3', null, `${NET[net] || net} · next ${hz.replace('h', '')}h by FDV band at entry`), h('div', { class: 'tbl' }, h('table', null, h('tr', null, ...['band', 'n', 'censored', '≥1.5x', '≥2x', '≥3x', 'halved', 'median peak', 'p90 peak'].map((x) => h('th', null, x))), ...rows.map(([k, c]) => h('tr', { style: c.biased ? 'opacity:.55' : '' }, h('td', null, k + (c.biased ? ' ⚠' : '')), h('td', null, c.n), h('td', null, c.censored), h('td', null, P(c.x15 / c.n)), h('td', null, `${P(c.x2 / c.n)} [${P(c.x2_ci?.lo)}–${P(c.x2_ci?.hi)}]`), h('td', null, P(c.x3 / c.n)), h('td', null, P(c.dd50 / c.n)), h('td', null, c.medianRatio ? c.medianRatio.toFixed(2) + 'x' : '—'), h('td', null, c.p90Ratio ? c.p90Ratio.toFixed(2) + 'x' : '—')))))));
    }
    for (const [net, o] of Object.entries(st.origins || {})) {
      if (!o.totalPumps) continue;
      out.push(h('div', { class: 'card' }, h('h3', null, `${NET[net] || net} · where ≥3x moves started (band 6h before peak) · ${o.totalPumps} pumps`), h('div', { class: 'tbl' }, h('table', null, h('tr', null, ...['band', 'pumps', 'share of pumps', 'share of exposure', 'lift'].map((x) => h('th', null, x))), ...Object.entries(o.lift).map(([k, x]) => h('tr', null, h('td', null, k), h('td', null, x.pumps), h('td', null, P(x.pumpShare)), h('td', null, P(x.exposureShare)), h('td', null, x.lift == null ? '—' : x.lift.toFixed(2)))))), h('div', { class: 'sub' }, 'e.g. ' + o.examples.map((e) => `${e.symbol} ${e.originBand}→${e.ratio}x in ${e.hoursBeforePeak}h`).join(' · '))));
    }
    return out;
  };
  // ---- health
  views.health = () => { const hh = S.health; return h('div', { class: 'kpi' }, h('div', null, h('small', null, 'recorder last tick'), h('b', null, hh.lastTick ? new Date(hh.lastTick).toUTCString().slice(17, 25) + 'Z' : '—')), h('div', null, h('small', null, 'pools in registry'), h('b', null, hh.pools ?? '—')), h('div', null, h('small', null, 'watching'), h('b', null, hh.watching ?? '—')), h('div', null, h('small', null, 'culled'), h('b', null, hh.culled ?? '—')), h('div', null, h('small', null, 'last tick'), h('b', null, hh.tickMs ? Math.round(hh.tickMs / 1000) + 's · ' + (hh.http429 ?? '?') + '×429' : '—')), h('div', null, h('small', null, 'band capture'), h('b', null, hh.captureAt ? `${hh.captureRows} rows · ${new Date(hh.captureAt).toUTCString().slice(17, 22)}Z` : '—'))); };

  const TABS = [['bands', 'bands'], ['picks', 'picks · lifecycle'], ['narratives', 'narratives'], ['shadow', 'shadow book'], ['loopback', 'loopback'], ['study', 'study'], ['health', 'health']];
  let tab = location.hash.slice(1) || localStorage.getItem('hs.tab') || 'bands'; if (!views[tab]) tab = 'bands';
  const nav = $('#nav'), main = $('#main');
  function render() { nav.innerHTML = ''; for (const [k, label] of TABS) nav.append(h('button', { class: k === tab ? 'on' : '', onclick: () => { tab = k; localStorage.setItem('hs.tab', k); location.hash = k; render(); } }, label)); main.innerHTML = ''; const v = views[tab](); main.append(...(Array.isArray(v) ? v : [v]).filter(Boolean)); }
  render();
})();
